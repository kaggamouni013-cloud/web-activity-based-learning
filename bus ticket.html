<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Booking</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f3;
            margin: 0;
        }

        header {
            background: #075e54;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 30px auto;
            padding: 20px;
            background: pink;
            border-radius: 10px;
            box-shadow: 0 3px 10px #bbb;
        }

        h2 {
            color: #075e54;
            text-align: center;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background: #075e54;
            color: white;
            border: none;
            cursor: pointer;
        }

        button :hover {
            background: #0b8f7e;
        }

        .card {
            background: #e0f2f1;
            padding: 15px;
            margin-top: 15px;
            border-radius: 8px;
        }

        footer {
            text-align: center;
            padding: 15px;
        }
    </style>
</head>
<body>
<header>
    <h1>🚍 Travel Booking</h1>
    <p>Book Bus and Train Tickets Easily</p>
</header>
<div class="container">
    <h2>Your Journey</h2>

    <form id="booking Form">
        <input type="text" id="source"
               placeholder="From (Source)" required>

        <input type="text" id="destination"
               placeholder="To (Destination)" required>

        <input type="date" id="date" required>

        <select id="transport" required>
            <option value="">Select Transport</option>
            <option value="Bus">Bus</option>
            <option value="Train">Train</option>
        </select>

        <input type="number" id="passengers"
               placeholder="Number of Passengers"
               min="1" max="10" required>

        <button type="submit">Book Tickets</button>
    </form>
</body>
</html>
